name: Android Multi-ABI Debug + Release (Auto-Signed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0）'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置版本号
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: 定位 gradlew 并构建
        run: |
          # 查找 gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 没找到 gradlew，请确认仓库包含 Gradle Wrapper"
            exit 1
          fi
          echo "✅ 找到 gradlew: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"

          # 构建 Debug + Release（Release 用 debug.keystore 签名）
          ./gradlew assembleDebug assembleRelease

      - name: 重命名 APK
        run: |
          mkdir -p renamed_apks
          for type in debug release; do
            find . -path "*/outputs/apk/$type/*.apk" | while read apk; do
              arch=$(basename "$apk" | sed -E "s/^app-([^-]+)-$type\.apk$/\1/")
              [ "$arch" = "app-$type.apk" ] && arch="universal"
              cp "$apk" "renamed_apks/${arch}-${type}-${{ steps.vars.outputs.version_name }}.apk"
            done
          done
          ls -lh renamed_apks

      - name: 发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: renamed_apks/*.apk
          tag_name: ${{ steps.vars.outputs.version_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
