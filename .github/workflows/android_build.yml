name: Android CI (Simple)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 移除所有 with 参数，让代码直接检出到工作目录的根部
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2: Build with Gradle (无需改动)
      # 现在它可以在正确的路径 /home/runner/work/HTTP-Shortcuts/gradlew 找到脚本了
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: check assembleDebug

      # 步骤 3: Upload Debug APK (无需改动)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: http-shortcuts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
