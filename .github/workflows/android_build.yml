name: Android CI (Simple)

on:
  push:
    branches: [ "develop" ] # 你的主分支是 develop
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1: 检出你的项目代码
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2: 使用 gradle-build-action 运行检查和构建
      # 它会自动安装 Java 17 (根据你的项目配置) 并缓存依赖
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          # 将多个任务写在一行，用空格隔开
          arguments: check assembleDebug

      # 步骤 3: 上传 Debug APK 作为构建产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: http-shortcuts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
