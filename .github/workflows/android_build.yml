name: Android CI (with Debug Step)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 确保这里没有任何 with: 或 path: 参数

      # --- 调试步骤 ---
      # 这个命令会递归地列出当前目录下的所有文件
      - name: Debug List files in the workspace
        run: ls -R
      # --- 调试步骤结束 ---

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: check assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: http-shortcuts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
