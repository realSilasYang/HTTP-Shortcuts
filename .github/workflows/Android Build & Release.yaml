# ============================================================
# Android 构建与发布工作流（逐行中文超详细注释版）
# 功能：
# 1. 支持手动触发（可输入版本号 + 选择构建类型）
# 2. 支持推送 tag 自动触发（版本号取自 tag，构建类型默认 all）
# 3. 使用 Gradle 构建 APK
# 4. 自适应查找 APK 并重命名为“类型-版本号.apk”
# 5. 智能跳过非所选类型的 APK
# 6. 自动生成发布说明（构建信息、变更日志、下载链接、SHA256 校验）
# 7. 自动发布到 GitHub Release
# ============================================================

name: Android Build & Release  # 工作流名称，会显示在 GitHub Actions 列表中

on:  # 定义触发条件
  workflow_dispatch:  # 手动触发
    inputs:  # 手动触发时可输入的参数
      version:  # 参数名：version
        description: '版本号（例如 v1.0.0，不填默认 all）'  # 在 UI 中显示的提示
        required: false  # 非必填
        default: 'all'  # 默认值为 all
      buildType:  # 参数名：buildType
        description: '构建类型（debug / release / releaseFull / all）'  # UI 提示
        required: true  # 必填
        default: 'all'  # 默认构建全部类型
        type: choice  # 类型为下拉选择
        options:  # 下拉选项
          - all
          - debug
          - release
          - releaseFull
  push:  # push 事件触发
    tags:  # 仅在推送 tag 时触发
      - 'v*'  # 匹配以 v 开头的 tag，例如 v1.0.0

jobs:  # 定义作业
  build:  # 作业 ID
    runs-on: ubuntu-latest  # 使用最新 Ubuntu 环境

    steps:  # 步骤列表
      - name: 拉取代码  # 步骤名称
        uses: actions/checkout@v4  # 官方 Action：检出仓库代码

      - name: 安装 JDK 17  # 安装 Java 17
        uses: actions/setup-java@v4  # 官方 Action：安装 Java
        with:
          distribution: 'temurin'  # 使用 Temurin 发行版（OpenJDK）
          java-version: '17'  # 指定版本为 17

      - name: 设置版本号和构建类型  # 统一处理版本号和构建类型
        id: vars  # 步骤 ID，方便后续引用
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}  # 从 tag 提取版本号
            BUILD_TYPE="all"  # tag 触发默认构建全部类型
          else
            VERSION="${{ github.event.inputs.version }}"  # 手动输入的版本号
            BUILD_TYPE="${{ github.event.inputs.buildType }}"  # 手动选择的构建类型
          fi
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT  # 输出版本号
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT  # 输出构建类型

      - name: 构建 APK  # 使用 Gradle 构建
        uses: gradle/gradle-build-action@v3  # 官方 Gradle Action
        with:
          build-root-directory: HTTPShortcuts  # 项目根目录（需按实际修改）
          arguments: |  # 构建任务
            ${{ steps.vars.outputs.build_type == 'all'
                && 'assembleDebug assembleRelease assembleReleaseFull'
                || format('assemble{0}', steps.vars.outputs.build_type) }}
            # 如果 build_type 是 all，则构建三种类型
            # 否则只构建指定类型（assembleDebug / assembleRelease / assembleReleaseFull）

      - name: 列出构建产物  # 调试用，查看 APK 生成位置
        run: |
          echo "📂 构建产物目录结构："
          ls -R HTTPShortcuts/app/build/outputs/apk || echo "⚠️ 未找到 outputs/apk 目录"

      - name: 重命名 APK（自适应路径）  # 查找并重命名 APK
        run: |
          mkdir -p renamed_apks  # 创建存放重命名 APK 的目录
          echo "🔍 正在查找 APK 文件..."
          APK_LIST=$(find HTTPShortcuts/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)

          if [ -z "$APK_LIST" ]; then
            echo "⚠️ 未找到任何 APK 文件，跳过重命名步骤"
            exit 0
          fi

          echo "📦 开始重命名..."
          echo "$APK_LIST" | while IFS= read -r apk; do
            TYPE=$(echo "$apk" | grep -oP '(?<=apk/)[^/]+' || true)  # 提取构建类型
            [ -z "$TYPE" ] && TYPE="unknown"

            if [ "${{ steps.vars.outputs.build_type }}" != "all" ] && [ "$TYPE" != "${{ steps.vars.outputs.build_type }}" ]; then
              echo "⏭ 跳过不匹配类型：$apk"
              continue
            fi

            cp "$apk" "renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
            echo "✅ 已处理：$apk → renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
          done

      - name: 生成发布说明  # 创建 RELEASE_NOTES.md
        run: |
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S %Z")
          OS_INFO=$(uname -a)
          JAVA_VER=$(java -version 2>&1 | head -n 1)

          echo "## 🛠 构建信息" > RELEASE_NOTES.md
          echo "- 构建时间: $BUILD_TIME" >> RELEASE_NOTES.md
          echo "- 构建环境: $OS_INFO" >> RELEASE_NOTES.md
          echo "- JDK 版本: $JAVA_VER" >> RELEASE_NOTES.md
          echo "- 构建类型: ${{ steps.vars.outputs.build_type }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 📦 构建类型说明" >> RELEASE_NOTES.md
          echo "- **debug**：调试版，带 “D” 图标，包名追加 .debug，开启调试功能，未混淆" >> RELEASE_NOTES.md
          echo "- **release**：无 Google 服务，可在 F-Droid 分发，已优化和混淆" >> RELEASE_NOTES.md
          echo "- **releaseFull**：包含 Google 服务，适合 Play 商店发布" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## ✨ 新增功能" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "feat" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 🐛 修复" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "fix" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## ⚡ 优化" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "refactor\|perf" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 📥 下载链接与 SHA256 校验值" >> RELEASE_NOTES.md
          shopt -s nullglob
          for file in renamed_apks/*.apk; do
            fname=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            echo "- [$fname](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.vars.outputs.version_name }}/$fname)" >> RELEASE_NOTES.md
            echo "  - SHA256: \`$sha256\`" >> RELEASE_NOTES.md
          done

      - name: 发布到 Release  # 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops
