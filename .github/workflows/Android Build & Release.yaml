# ============================================================
# Android 构建与发布工作流（逐行中文超详细注释 + buildType 默认值修复）
# 功能：
# 1. 手动触发：可输入版本号(version) + 选择构建类型(buildType)
# 2. tag 触发：版本号自动取 tag，构建类型默认 all
# 3. Gradle 构建 APK（支持 debug / release / releaseFull / all）
# 4. 自适应查找 APK 并重命名为“类型-版本号.apk”
# 5. 智能跳过非所选类型的 APK
# 6. 自动生成发布说明（构建信息、变更日志、下载链接、SHA256 校验）
# 7. 自动发布到 GitHub Release
# ============================================================

name: Android Build & Release  # 工作流名称，显示在 GitHub Actions 列表中

on:
  workflow_dispatch:  # 允许手动触发工作流
    inputs:  # 定义手动触发时可输入的参数
      version:  # 参数1：版本号
        description: '版本号（例如 v1.0.0，不填默认 all）'  # 提示文字
        required: false  # 可选，不强制输入
        default: 'all'   # 默认值是 all（即全部版本）
      buildType:  # 参数2：构建类型
        description: '构建类型（debug / release / releaseFull / all）'
        required: true  # 必填
        default: 'all'  # 默认值是 all（构建所有类型）
        type: choice    # 下拉选择
        options:        # 允许选择的值
          - all
          - debug
          - release
          - releaseFull
  push:  # 当仓库 push 时触发
    tags:  # 限制仅在打 tag 时触发
      - 'v*'  # 仅匹配 v 开头的标签，例如 v1.0.0

jobs:
  build:  # 定义一个名为 build 的 job
    runs-on: ubuntu-latest  # 运行环境：最新的 Ubuntu

    steps:  # 任务步骤
      - name: 拉取代码  # 步骤1：获取仓库代码
        uses: actions/checkout@v4  # 官方动作，拉取当前仓库源码

      - name: 安装 JDK 17  # 步骤2：安装 Java 环境
        uses: actions/setup-java@v4  # 官方 Java 设置动作
        with:
          distribution: 'temurin'  # 采用 Eclipse Temurin 发行版
          java-version: '17'       # 指定 Java 版本为 17

      - name: 设置版本号和构建类型  # 步骤3：确定版本号与构建类型
        id: vars  # 设置步骤 ID，供后续步骤引用
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}  # 从 tag 中提取版本号（去掉前缀 refs/tags/）
            BUILD_TYPE="all"  # 如果是 tag 触发，则构建全部类型
          else
            VERSION="${{ github.event.inputs.version }}"  # 否则取手动输入的版本号
            BUILD_TYPE="${{ github.event.inputs.buildType }}"  # 构建类型取手动输入
          fi
          # 将结果写入 GitHub Actions 输出，供后续 steps 使用
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: 构建 APK  # 步骤4：执行 Gradle 构建
        uses: gradle/gradle-build-action@v3  # 使用官方 Gradle Action
        with:
          build-root-directory: HTTPShortcuts  # 指定 Gradle 项目根目录
          arguments: |  # 构建参数
            ${{ steps.vars.outputs.build_type == 'all'
                && 'assembleDebug assembleRelease assembleReleaseFull'
                || format('assemble{0}', steps.vars.outputs.build_type) }}
            # 如果 build_type=all，则同时构建三种版本
            # 否则只构建所选类型（例如 assembleDebug / assembleRelease）

      - name: 列出构建产物  # 步骤5：调试用，列出生成的 APK 文件目录
        run: |
          echo "📂 构建产物目录结构："
          ls -R HTTPShortcuts/app/build/outputs/apk || echo "⚠️ 未找到 outputs/apk 目录"

      - name: 重命名 APK（自适应路径）  # 步骤6：自动重命名 APK
        run: |
          mkdir -p renamed_apks  # 创建输出目录
          echo "🔍 正在查找 APK 文件..."
          APK_LIST=$(find HTTPShortcuts/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)

          if [ -z "$APK_LIST" ]; then
            echo "⚠️ 未找到任何 APK 文件，跳过重命名步骤"
            exit 0
          fi

          echo "📦 开始重命名..."
          echo "$APK_LIST" | while IFS= read -r apk; do
            TYPE=$(echo "$apk" | grep -oP '(?<=apk/)[^/]+' || true)  # 从路径中提取构建类型目录名
            [ -z "$TYPE" ] && TYPE="unknown"  # 如果提取不到，则标记为 unknown

            # 如果用户选择了具体 buildType，则跳过不匹配的 APK
            if [ "${{ steps.vars.outputs.build_type }}" != "all" ] && [ "$TYPE" != "${{ steps.vars.outputs.build_type }}" ]; then
              echo "⏭ 跳过不匹配类型：$apk"
              continue
            fi

            # 复制并重命名，格式：类型-版本号.apk
            cp "$apk" "renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
            echo "✅ 已处理：$apk → renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
          done

      - name: 生成发布说明  # 步骤7：生成 Release 说明文件
        run: |
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S %Z")  # 构建时间
          OS_INFO=$(uname -a)  # 系统信息
          JAVA_VER=$(java -version 2>&1 | head -n 1)  # JDK 版本

          # 输出到 RELEASE_NOTES.md 文件
          echo "## 🛠 构建信息" > RELEASE_NOTES.md
          echo "- 构建时间: $BUILD_TIME" >> RELEASE_NOTES.md
          echo "- 构建环境: $OS_INFO" >> RELEASE_NOTES.md
          echo "- JDK 版本: $JAVA_VER" >> RELEASE_NOTES.md
          echo "- 构建类型: ${{ steps.vars.outputs.build_type }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 📦 构建类型说明" >> RELEASE_NOTES.md
          echo "- **debug**：调试版，带 “D” 图标，包名追加 .debug，开启调试功能，未混淆" >> RELEASE_NOTES.md
          echo "- **release**：无 Google 服务，可在 F-Droid 分发，已优化和混淆" >> RELEASE_NOTES.md
          echo "- **releaseFull**：包含 Google 服务，适合 Play 商店发布" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          # 变更日志：提取 commit 信息
          echo "## ✨ 新增功能" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "feat" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 🐛 修复" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "fix" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## ⚡ 优化" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "refactor\|perf" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          # 下载链接和 SHA256 校验值
          echo "## 📥 下载链接与 SHA256 校验值" >> RELEASE_NOTES.md
          shopt -s nullglob  # 防止找不到文件时报错
          for file in renamed_apks/*.apk; do
            fname=$(basename "$file")  # 获取文件名
            sha256=$(sha256sum "$file" | awk '{print $1}')  # 计算 SHA256
            echo "- [$fname](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.vars.outputs.version_name }}/$fname)" >> RELEASE_NOTES.md
            echo "  - SHA256: \`$sha256\`" >> RELEASE_NOTES.md
          done

      - name: 发布到 Release  # 步骤8：将 APK 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1  # 使用第三方 Action 发布 Release
        with:
          files: renamed_apks/*.apk  # 上传的文件（重命名后的 APK）
          body_path: RELEASE_NOTES.md  # 发布说明路径
          tag_name: ${{ steps.vars.outputs.version_name }}  # 使用版本号作为 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动注入的 Token，授权发布
