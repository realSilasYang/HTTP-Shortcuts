name: Android Multi-ABI Debug + Release (Auto-Signed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
      buildType:
        description: '构建类型（debug/release/releaseFull）'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置版本号
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.buildType }}"
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: 自动打 Tag（如果不存在）
        run: |
          VERSION="${{ steps.vars.outputs.version_name }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "✅ Tag $VERSION 已存在"
          else
            echo "🏷 创建 Tag $VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: 解码签名文件
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: 构建 Debug + Release（自动签名）
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 没找到 gradlew，请确认仓库包含 Gradle Wrapper"
            exit 1
          fi
          echo "✅ 找到 gradlew: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"
          ./gradlew assembleDebug assembleRelease
        env:
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: 重命名 APK
        run: |
          mkdir -p renamed_apks
          for type in debug release; do
            find . -path "*/outputs/apk/$type/*.apk" | while read apk; do
              arch=$(basename "$apk" | sed -E "s/^app-([^-]+)-$type\.apk$/\1/")
              [ "$arch" = "app-$type.apk" ] && arch="universal"
              cp "$apk" "renamed_apks/${arch}-${type}-${{ steps.vars.outputs.version_name }}.apk"
            done
          done
          ls -lh renamed_apks

      - name: 生成自动化更新日志
        id: changelog
        run: |
          VERSION="${{ steps.vars.outputs.version_name }}"
          LAST_TAG=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..$VERSION"
          else
            RANGE="$VERSION"
          fi

          FEAT=$(git log $RANGE --pretty=format:"- %s" --grep="feat\|feature" || echo "无")
          FIX=$(git log $RANGE --pretty=format:"- %s" --grep="fix\|bug" || echo "无")
          PERF=$(git log $RANGE --pretty=format:"- %s" --grep="perf\|optimize\|优化" || echo "无")

          echo "feat_list=$FEAT" >> $GITHUB_OUTPUT
          echo "fix_list=$FIX" >> $GITHUB_OUTPUT
          echo "perf_list=$PERF" >> $GITHUB_OUTPUT

      - name: 生成构建信息（自动化）
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BUILD_ENV=$(uname -a)
          JDK_VERSION=$(java -version 2>&1 | head -n 1)
          BUILD_TYPE="${{ steps.vars.outputs.build_type }}"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${{ steps.vars.outputs.version_name }}"

          cat << EOF > build_info.txt
🛠 构建信息

构建时间: $BUILD_TIME  
构建环境: $BUILD_ENV  
JDK 版本: $JDK_VERSION  
构建类型: $BUILD_TYPE  

📦 构建类型说明

debug：调试版，带 “D” 图标，包名追加 .debug，开启调试功能，未混淆  
release：无 Google 服务，可在 F-Droid 分发，已优化和混淆  
releaseFull：包含 Google 服务，适合 Play 商店发布  

✨ 新增功能  
${{ steps.changelog.outputs.feat_list }}  

🐛 修复  
${{ steps.changelog.outputs.fix_list }}  

⚡ 优化  
${{ steps.changelog.outputs.perf_list }}  

📥 下载链接与 SHA256 校验值
EOF

          echo "" >> build_info.txt
          for file in renamed_apks/*.apk; do
            fname=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            echo "- [$fname](https://github.com/$REPO/releases/download/$TAG/$fname)  \`SHA256: $sha256\`" >> build_info.txt
          done

      - name: 发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: renamed_apks/*.apk
          tag_name: ${{ steps.vars.outputs.version_name }}
          body_path: build_info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
