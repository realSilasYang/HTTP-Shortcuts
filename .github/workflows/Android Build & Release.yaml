# ============================================================
# Android 构建与发布工作流（逐行中文超详细注释 + buildType 默认值修复）
# 功能：
# 1. 手动触发：可输入版本号(version) + 选择构建类型(buildType)
# 2. tag 触发：版本号自动取 tag，构建类型默认 all
# 3. Gradle 构建 APK（支持 debug / release / releaseFull / all）
# 4. 自适应查找 APK 并重命名为“类型-版本号.apk”
# 5. 智能跳过非所选类型的 APK
# 6. 自动生成发布说明（构建信息、变更日志、下载链接、SHA256 校验）
# 7. 自动发布到 GitHub Release
# ============================================================

name: Android Build & Release  # 定义工作流名称，在 GitHub Actions 页面显示

on:
  workflow_dispatch:  # 支持手动触发工作流
    inputs:
      version:  # 输入参数：版本号
        description: '版本号（例如 v1.0.0，不填默认 all）'  # 输入框提示
        required: false  # 版本号可以不填
        default: 'all'  # 默认值 all（主要用于 tag 触发时）
      buildType:  # 输入参数：构建类型
        description: '构建类型（debug / release / releaseFull / all）'  # 输入框提示
        required: true  # 必填
        default: 'all'  # 默认值 all（会构建所有类型）
        type: choice  # 输入类型为下拉选择
        options:  # 可选项
          - all
          - debug
          - release
          - releaseFull
  push:  # push 触发条件
    tags:  # 当推送 tag 时触发
      - 'v*'  # 匹配以 v 开头的 tag，例如 v1.0.0

jobs:
  build:  # 定义一个名为 build 的 Job
    runs-on: ubuntu-latest  # 在最新的 Ubuntu Runner 环境运行

    steps:  # 工作流中的每一步操作
      - name: 拉取代码  # 第一步：拉取仓库源码
        uses: actions/checkout@v4  # 使用官方 checkout action，默认拉取当前分支代码

      - name: 安装 JDK 17  # 第二步：安装 Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # JDK 发行版选择 temurin（AdoptOpenJDK 前身）
          java-version: '17'  # 指定 JDK 版本 17

      - name: 设置版本号和构建类型  # 第三步：确定版本号与构建类型
        id: vars  # 设置 ID，供后续 steps 调用其输出
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}  # 如果是 tag 触发，从 tag 名获取版本号
            BUILD_TYPE="all"  # tag 触发时强制构建所有类型
          else
            VERSION="${{ github.event.inputs.version }}"  # 手动触发时，取输入的版本号
            BUILD_TYPE="${{ github.event.inputs.buildType }}"  # 手动触发时，取输入的构建类型
          fi
          # 将变量写入 GitHub Actions 输出，供后续步骤使用
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: 构建 APK  # 第四步：执行 Gradle 构建
        uses: gradle/gradle-build-action@v3  # 使用官方 Gradle 构建 Action
        with:
          build-root-directory: HTTPShortcuts  # 指定构建目录（根目录下的 HTTPShortcuts 子目录）
          arguments: |  # 传递构建参数
            ${{ steps.vars.outputs.build_type == 'all'
                && 'assembleDebug assembleRelease assembleReleaseFull'  # 如果选择 all，则依次构建三种类型
                || format('assemble{0}', steps.vars.outputs.build_type) }}  # 否则只构建指定的单一类型

      - name: 列出构建产物  # 第五步：检查 APK 是否生成
        run: |
          echo "📂 构建产物目录结构："  # 打印提示
          ls -R HTTPShortcuts/app/build/outputs/apk || echo "⚠️ 未找到 outputs/apk 目录"  # 列出 apk 目录（如果不存在则提示）

      - name: 重命名 APK（自适应路径）  # 第六步：查找并重命名 APK
        run: |
          mkdir -p renamed_apks  # 创建存放重命名文件的目录
          echo "🔍 正在查找 APK 文件..."
          APK_LIST=$(find HTTPShortcuts/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)  # 查找所有 apk 文件

          if [ -z "$APK_LIST" ]; then
            echo "⚠️ 未找到任何 APK 文件，跳过重命名步骤"
            exit 0  # 若没找到则直接跳过
          fi

          echo "📦 开始重命名..."
          echo "$APK_LIST" | while IFS= read -r apk; do  # 遍历所有找到的 APK
            TYPE=$(echo "$apk" | grep -oP '(?<=apk/)[^/]+' || true)  # 从路径中提取类型（如 debug、release）
            [ -z "$TYPE" ] && TYPE="unknown"  # 如果没匹配到类型则标记 unknown

            # 如果构建类型不是 all，则只保留匹配类型的 APK，其余跳过
            if [ "${{ steps.vars.outputs.build_type }}" != "all" ] && [ "$TYPE" != "${{ steps.vars.outputs.build_type }}" ]; then
              echo "⏭ 跳过不匹配类型：$apk"
              continue
            fi

            # 将 APK 复制并重命名为 “类型-版本号.apk”
            cp "$apk" "renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
            echo "✅ 已处理：$apk → renamed_apks/${TYPE}-${{ steps.vars.outputs.version_name }}.apk"
          done

      - name: 生成发布说明  # 第七步：自动生成 Release Notes
        run: |
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S %Z")  # 获取构建时间
          OS_INFO=$(uname -a)  # 获取操作系统信息
          JAVA_VER=$(java -version 2>&1 | head -n 1)  # 获取 JDK 版本

          echo "## 🛠 构建信息" > RELEASE_NOTES.md
          echo "- 构建时间: $BUILD_TIME" >> RELEASE_NOTES.md
          echo "- 构建环境: $OS_INFO" >> RELEASE_NOTES.md
          echo "- JDK 版本: $JAVA_VER" >> RELEASE_NOTES.md
          echo "- 构建类型: ${{ steps.vars.outputs.build_type }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 📦 构建类型说明" >> RELEASE_NOTES.md
          echo "- **debug**：调试版，带 “D” 图标，包名追加 .debug，开启调试功能，未混淆" >> RELEASE_NOTES.md
          echo "- **release**：无 Google 服务，可在 F-Droid 分发，已优化和混淆" >> RELEASE_NOTES.md
          echo "- **releaseFull**：包含 Google 服务，适合 Play 商店发布" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## ✨ 新增功能" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "feat" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 🐛 修复" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "fix" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## ⚡ 优化" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 @^)..@ --pretty=format:"- %s" | grep -i "refactor\|perf" >> RELEASE_NOTES.md || echo "- 无" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "## 📥 下载链接与 SHA256 校验值" >> RELEASE_NOTES.md
          shopt -s nullglob  # 防止空目录报错
          for file in renamed_apks/*.apk; do  # 遍历所有重命名后的 APK
            fname=$(basename "$file")  # 提取文件名
            sha256=$(sha256sum "$file" | awk '{print $1}')  # 计算 SHA256 校验值
            echo "- [$fname](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.vars.outputs.version_name }}/$fname)" >> RELEASE_NOTES.md
            echo "  - SHA256: \`$sha256\`" >> RELEASE_NOTES.md
          done

      - name: 发布到 Release  # 第八步：上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'  # 条件：必须是 tag 触发或手动触发
        uses: softprops/action-gh-release@v1  # 使用第三方 action 发布 release
        with:
          files: renamed_apks/*.apk  # 上传所有 APK
          body_path: RELEASE_NOTES.md  # 使用上一步生成的 Release Notes
          tag_name: ${{ steps.vars.outputs.version_name }}  # 版本号作为 Release Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub 自动提供的 token 进行认证
